<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />

    <meta
      name="viewport"
      content="width=device-width, initial-scale=1.0"
    />

    <title>Page Not Found | Nathan</title>

    <meta
      name="description"
      content="The page you are looking for could not be found."
    />

    <style>
      :root {
        color-scheme: dark;

        --bg: #090909;
        --surface: #111111;
        --surface-hover: #181818;

        --text: #ffffff;
        --text-secondary: #b8b8b8;
        --text-muted: #707070;

        --orange: #ff8a00;
        --orange-light: #ffad32;
        --yellow: #ffc400;

        --border: rgba(255, 255, 255, 0.1);
        --accent-border: rgba(255, 138, 0, 0.4);

        --glow: rgba(255, 138, 0, 0.2);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        width: 100%;
        min-height: 100%;
        margin: 0;
      }

      body {
        min-height: 100vh;

        display: flex;
        align-items: center;
        justify-content: center;

        padding: 2rem;

        overflow: hidden;

        background:
          radial-gradient(
            circle at 50% 30%,
            rgba(255, 138, 0, 0.08),
            transparent 35%
          ),
          var(--bg);

        color: var(--text);

        font-family:
          Inter,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .error-page {
        width: min(100%, 700px);

        text-align: center;
      }

      .error-code {
        margin: 0;

        font-size:
          clamp(
            7rem,
            22vw,
            13rem
          );

        font-weight: 900;

        line-height: 0.85;

        letter-spacing: -0.08em;

        background:
          linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange),
            var(--yellow)
          );

        -webkit-background-clip: text;
        background-clip: text;

        color: transparent;

        text-shadow:
          0 0 50px
          rgba(255, 138, 0, 0.12);
      }

      .error-title {
        margin:
          2rem 0 0;

        font-size:
          clamp(
            1.5rem,
            4vw,
            2.4rem
          );

        font-weight: 700;

        letter-spacing: -0.04em;
      }

      .error-description {
        max-width: 520px;

        margin:
          1rem auto 0;

        color: var(--text-secondary);

        font-size: 1rem;

        line-height: 1.7;
      }

      .error-actions {
        margin-top: 2rem;

        display: flex;

        justify-content: center;

        flex-wrap: wrap;

        gap: 0.75rem;
      }

      .error-button {
        min-height: 46px;

        padding:
          0.7rem 1.2rem;

        display: inline-flex;

        align-items: center;

        justify-content: center;

        border-radius: 999px;

        font-size: 0.9rem;

        font-weight: 600;

        text-decoration: none;

        cursor: pointer;

        transition:
          transform 200ms ease,
          background 200ms ease,
          border-color 200ms ease,
          box-shadow 200ms ease;
      }

      .error-button-primary {
        color: #090909;

        background:
          linear-gradient(
            135deg,
            var(--orange-light),
            var(--orange),
            var(--yellow)
          );

        border: 1px solid transparent;

        box-shadow:
          0 10px 30px var(--glow);
      }

      .error-button-secondary {
        color: var(--text);

        background:
          rgba(255, 255, 255, 0.04);

        border:
          1px solid var(--border);
      }

      .error-button:hover {
        transform: translateY(-2px);
      }

      .error-button-secondary:hover {
        border-color: var(--accent-border);

        background:
          rgba(255, 138, 0, 0.07);
      }

      .error-status {
        margin-top: 2.5rem;

        display: inline-flex;

        align-items: center;

        gap: 0.5rem;

        color: var(--text-muted);

        font-size: 0.75rem;

        letter-spacing: 0.08em;

        text-transform: uppercase;
      }

      .error-dot {
        width: 7px;
        height: 7px;

        border-radius: 50%;

        background: var(--orange);

        box-shadow:
          0 0 10px
          rgba(255, 138, 0, 0.6);

        animation:
          pulse 2s ease-in-out infinite;
      }

      @keyframes pulse {
        0%,
        100% {
          opacity: 0.45;
          transform: scale(0.85);
        }

        50% {
          opacity: 1;
          transform: scale(1.15);
        }
      }

      @media (max-width: 480px) {
        body {
          padding: 1.25rem;
        }

        .error-code {
          font-size: 7rem;
        }

        .error-description {
          font-size: 0.9rem;
        }

        .error-actions {
          flex-direction: column;
        }

        .error-button {
          width: 100%;
        }
      }

      @media (prefers-reduced-motion: reduce) {
        .error-dot {
          animation: none;
        }

        .error-button {
          transition: none;
        }
      }
    </style>
  </head>

  <body>
    <main class="error-page">

      <p
        class="error-code"
        aria-hidden="true"
      >
        404
      </p>

      <h1 class="error-title">
        Page not found
      </h1>

      <p class="error-description">
        The page you're looking for doesn't exist,
        may have been moved, or the URL may be incorrect.
      </p>

      <div class="error-actions">

        <a
          href="/"
          class="error-button error-button-primary"
        >
          Go Home
        </a>

        <button
          type="button"
          class="error-button error-button-secondary"
          onclick="history.back()"
        >
          Go Back
        </button>

      </div>

      <div class="error-status">
        <span
          class="error-dot"
          aria-hidden="true"
        ></span>

        <span>
          Nathan — Frontend Developer
        </span>
      </div>

    </main>
  </body>
</html>
